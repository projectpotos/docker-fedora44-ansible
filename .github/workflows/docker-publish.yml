---
name: docker-publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly rebuild so the image keeps up with upstream Fedora updates.
    - cron: "25 2 * * 1"

permissions: {}

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # keyless signing for the provenance attestation
      attestations: write # write the build-provenance attestation
    uses: projectpotos/actions/.github/workflows/release-container.yaml@cc9fa23313351dbc2443f830da4a111f96d293c6 # v0.2.2
    with:
      setup-qemu: true
      # Single rolling tag, matching the upstream geerlingguy image:
      # default branch -> :latest
      tags: |
        type=raw,value=latest,enable={{is_default_branch}}
      labels: |
        org.opencontainers.image.title=docker-fedora44-ansible
        org.opencontainers.image.description=Fedora 44 container for Ansible playbook and role testing
        org.opencontainers.image.licenses=MIT
