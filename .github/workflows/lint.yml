---
name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
    uses: projectpotos/actions/.github/workflows/test-lint.yaml@cc9fa23313351dbc2443f830da4a111f96d293c6 # v0.2.2
    with:
      yamllint-mode: standalone
      hadolint: true

  all_green:
    name: all_green
    if: ${{ always() }}
    needs:
      - lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify no required job failed or was cancelled
        uses: projectpotos/actions/all-green@cc9fa23313351dbc2443f830da4a111f96d293c6 # v0.2.2
        with:
          needs: ${{ toJSON(needs) }}
